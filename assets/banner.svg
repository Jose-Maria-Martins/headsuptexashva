<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14162e"/>
      <stop offset="1" stop-color="#232552"/>
    </linearGradient>
    <radialGradient id="felt" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f7a4d"/>
      <stop offset="1" stop-color="#0f4a2e"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <g id="card">
      <rect width="120" height="168" rx="12" fill="#fff" stroke="#d9d9e3" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>

  <!-- table -->
  <ellipse cx="900" cy="200" rx="270" ry="150" fill="url(#felt)" stroke="#ffd700" stroke-width="5"/>
  <ellipse cx="900" cy="200" rx="250" ry="132" fill="none" stroke="#ffd700" stroke-opacity="0.25" stroke-width="2"/>

  <!-- chips -->
  <g filter="url(#shadow)">
    <g transform="translate(700 255)">
      <ellipse cx="0" cy="12" rx="34" ry="12" fill="#a8121e"/>
      <ellipse cx="0" cy="6" rx="34" ry="12" fill="#c8202e"/>
      <ellipse cx="0" cy="0" rx="34" ry="12" fill="#e03342" stroke="#fff" stroke-width="3" stroke-dasharray="8 7"/>
    </g>
    <g transform="translate(1100 250)">
      <ellipse cx="0" cy="12" rx="34" ry="12" fill="#0e4f9c"/>
      <ellipse cx="0" cy="6" rx="34" ry="12" fill="#1663c0"/>
      <ellipse cx="0" cy="0" rx="34" ry="12" fill="#2b7de0" stroke="#fff" stroke-width="3" stroke-dasharray="8 7"/>
    </g>
  </g>

  <!-- hole cards: A♠ A♥ -->
  <g filter="url(#shadow)">
    <g transform="translate(780 110) rotate(-10 60 84)">
      <use href="#card"/>
      <text x="14" y="40" font-size="32" font-weight="700" fill="#111">A</text>
      <text x="16" y="72" font-size="28" fill="#111">♠</text>
      <text x="60" y="116" font-size="64" text-anchor="middle" fill="#111">♠</text>
    </g>
    <g transform="translate(900 102) rotate(8 60 84)">
      <use href="#card"/>
      <text x="14" y="40" font-size="32" font-weight="700" fill="#d01c2a">A</text>
      <text x="16" y="72" font-size="28" fill="#d01c2a">♥</text>
      <text x="60" y="116" font-size="64" text-anchor="middle" fill="#d01c2a">♥</text>
    </g>
  </g>

  <!-- title -->
  <text x="70" y="150" font-size="64" font-weight="800" fill="#ffd700">Heads-Up</text>
  <text x="70" y="222" font-size="64" font-weight="800" fill="#ffd700">Poker Bot</text>
  <text x="72" y="272" font-size="24" fill="#c9cbe8">Four bots · one C++ engine · every match replayable</text>
  <g font-size="30" fill="#c9cbe8" fill-opacity="0.7">
    <text x="72" y="326">♠</text>
    <text x="106" y="326" fill="#e03342" fill-opacity="0.9">♥</text>
    <text x="140" y="326">♣</text>
    <text x="174" y="326" fill="#e03342" fill-opacity="0.9">♦</text>
  </g>
</svg>
