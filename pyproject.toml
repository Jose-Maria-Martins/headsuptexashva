[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heads-up-poker"
version = "0.2.0"
description = "Educational heads-up poker simulation and bot benchmarking (research demo)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Heads-Up Poker Research Project" }]
dependencies = [
    "numpy>=1.24",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "pybind11>=2.12",
]
experiments = [
    "pybind11>=2.12",
]

[tool.setuptools.packages.find]
include = ["poker_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests requiring built engine",
    "property: property-based tests",
    "regression: deterministic regression fixtures",
    "slow: longer-running checks",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["W293"]  # CRLF blank-line noise on Windows checkouts
